<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onde está o caminhão? | Recicla-me Se For Capaz</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- Leaflet: biblioteca gratuita de mapas (arquivos na pasta libs, não precisa de chave) -->
  <link rel="stylesheet" href="libs/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="../js/theme.js" defer></script>
</head>
<body>

  <header>
    <div id="topo">
      <span>♻️ RECICLA-ME ♻️</span>
      <h1>Recicla-me Se For Capaz</h1>
      <button
        class="theme-toggle"
        type="button"
        aria-label="Ativar modo escuro"
        aria-pressed="false"
      >
        ☾ Modo escuro
      </button>
    </div>
  </header>

  <nav aria-label="Navegação principal">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../cadastro.html">Cadastre-se</a></li>
      <li><a href="../separacao.html">Separação do lixo</a></li>
      <li><a href="../jogo-separacao.html">Jogo de separação</a></li>
      <li><a href="index.html" aria-current="page">Rota do caminhão</a></li>
      <li><a href="../contato.html">Contato</a></li>
    </ul>
  </nav>

  <p class="aviso-rota">Demonstração: a rota é simulada. Na versão real, a posição viria de um servidor (UC4).</p>

  <main>
    <!-- o mapa é desenhado pelo Leaflet dentro desta div -->
    <div id="mapa" aria-label="Mapa com a rota do caminhão de coleta"></div>

    <section id="painel">
      <!-- role="status": o leitor de tela anuncia quando o texto muda -->
      <p id="status" role="status">Carregando a rota...</p>

      <div class="botoes">
        <button type="button" id="botao-iniciar" disabled>▶ Iniciar rota</button>
        <button type="button" id="botao-reiniciar" disabled>↺ Reiniciar</button>
        <button type="button" id="botao-onde-estou">📍 Onde estou?</button>
      </div>

      <p id="info-usuario" role="status"></p>

      <h2>Paradas</h2>
      <ol id="lista-paradas"></ol>
    </section>
  </main>

  <script src="libs/leaflet.js"></script>
  <script src="caminhao.js"></script>
</body>
</html>
